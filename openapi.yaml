                                type: object
                                required:
                                    - statusCode
                                    - data
                                properties:
                                    statusCode:
                                        type: integer
                                        example: 200
                                    data:
                                        $ref: '#/components/schemas/User'

                '404':
                    description: User not found
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - statusCode
                                    - error
                                properties:
                                    statusCode:
                                        type: integer
                                        example: 404
                                    error:
