openapi: 3.0.3
info:
    title: Admin-UI
    version: 0.2.0
    description: >-
        Samlad OpenAPI-specifikation för Admin UI i simning.ax.
        Specifikationen innehåller kontrakt för de backend-tjänster som
        används av administrationsgränssnittet och används som underlag
        för generering av TypeScript-interface.

paths:
    /users:
        post:
            summary: Create user
            operationId: createUser
            tags:
                - Users
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequest'
            responses:
                '201':
                    description: User created
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - statusCode
                                    - data
                                properties:
                                    statusCode:
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/User'

                '409':
                    description: User already exists
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - statusCode
                                    - error
                                properties:
                                    statusCode:
                                        type: integer
                                        example: 409
                                    error:
                                        $ref: '#/components/schemas/ErrorResponse'
                '422':
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - statusCode
                                    - error
                                properties:
                                    statusCode:
                                        type: integer
                                        example: 422
                                    error:
                                        $ref: '#/components/schemas/ErrorResponse'
        get:
            summary: Get all users
            operationId: getAllUsers
            tags:
                - Users
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - statusCode
                                    - data
                                properties:
                                    statusCode:
                                        type: integer
                                        example: 200
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/User'

    /users/{id}:
        get:
            summary: Get user by ID
            operationId: getUserById
            tags:
                - Users
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - statusCode
                                    - data
                                properties:
                                    statusCode:
                                        type: integer
                                        example: 200
                                    data:
