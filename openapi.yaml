                '409':
                    description: User exists
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - statusCode
                                    - error
                                properties:
                                    statusCode:
                                        type: integer
                                        example: 409
                                    error:
                                        $ref: '#/components/schemas/ErrorResponse'
                '422':
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - statusCode
                                    - error
                                properties:
                                    statusCode:
                                        type: integer
                                        example: 422
                                    error:
                                        $ref: '#/components/schemas/ErrorResponse'

        delete:
            summary: Delete user
            operationId: deleteUser
            tags:
                - Users
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '204':
                    description: User deleted
                '404':
                    description: User not found
                    content:
                        application/json:
