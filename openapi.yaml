components:
    schemas:
        ErrorResponse:
            type: object
            required:
                - type
                - message
            properties:
                type:
                    type: string
                message:
                    type: string
                details:
                    type: object
                    nullable: true
                    additionalProperties: true

        CreateUserRequest:
            type: object
            additionalProperties: false
            required:
                - email
                - firstName
                - lastName
                - roles
            properties:
                email:
                    type: string
                    format: email
                    example: test@example.com
                firstName:
                    type: string
                    minLength: 2
                    example: User
                lastName:
                    type: string
                    minLength: 2
                    example: Name
                roles:
                    type: array
                    items:
                        type: string
                        format: uuid
                    example:
                        - 12345678-1234-1234-1234-1234567890ab

        UpdateUserRequest:
            type: object
            additionalProperties: false
            required:
                - id
                - email
                - firstName
                - lastName
                - roles
            properties:
                id:
                    type: string
                    format: uuid
                email:
